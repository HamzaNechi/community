<title>Communauté Le Revenu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout : forum trois colonnes (espaces | fil | rituels & progression), une colonne + barre basse sur mobile */
/* Esprit macOS, identité Le Revenu : le logo, le rouge #EB0F0F et Playfair Display pour les titres
   restent ceux de la charte ; la matière vient de macOS — police système, fond gris Apple, cartes
   arrondies à ombre douce, barres translucides floutées, contrôles segmentés. L'or reste réservé
   au statut abonné. */
:root{
  --rev-red:#eb0f0f; --rev-black:#000000;
  --bg:#f5f5f7; --surface:#ffffff; --surface-2:#f2f2f4; --surface-3:#fff3f2;
  --glass:rgba(255,255,255,.72); --glass-strong:rgba(255,255,255,.86);
  --line:#e5e5ea; --line-strong:#c7c7cc; --hairline:rgba(0,0,0,.07); --fill:rgba(0,0,0,.05); --fill-2:rgba(0,0,0,.08);
  --ink:#1d1d1f; --ink-2:#424245; --ink-3:#6e6e73;
  --brand:#eb0f0f; --brand-hover:#d00d0d; --brand-ink:#ffffff; --brand-soft:#ffeceb; --brand-text:#e00b0b;
  --accent:#e00b0b; --accent-soft:#ffeceb;
  --ok:#1a8a4a; --ok-soft:#e4f6ea; --alert:#e00b0b; --alert-soft:#ffeceb;
  --redac:#e00b0b; --redac-soft:#fff5f4;
  --sub:#c9a032; --sub-ink:#1d1d1f;
  --av-1:#5856d6; --av-2:#0a7f99; --av-3:#6e6e73; --av-4:#c93400; --av-5:#d30f45;
  --hero:#1c1c1e; --hero-top:#3a3a3c;
  /* Annotations de maquette : volontairement hors charte, pour ne jamais se confondre avec le produit */
  --note:#6d28d9; --note-ink:#ffffff;
  --blog:#4b48c9; --pro:#0a66d8;
  --shadow:0 0 0 .5px rgba(0,0,0,.03),0 1px 2px rgba(0,0,0,.05),0 6px 16px -6px rgba(0,0,0,.08);
  --shadow-lg:0 0 0 .5px rgba(0,0,0,.08),0 20px 50px -10px rgba(0,0,0,.28);
  --f-display:'Playfair Display','Times New Roman',Georgia,serif;
  --f-body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Helvetica Neue',Arial,sans-serif;
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#161618; --surface:#232325; --surface-2:#2c2c2e; --surface-3:#2e1f1f;
  --glass:rgba(35,35,37,.72); --glass-strong:rgba(44,44,46,.86);
  --line:#38383a; --line-strong:#545456; --hairline:rgba(255,255,255,.08); --fill:rgba(255,255,255,.07); --fill-2:rgba(255,255,255,.11);
  --ink:#f5f5f7; --ink-2:#c7c7cc; --ink-3:#8e8e93;
  --brand:#eb0f0f; --brand-hover:#ff2d2d; --brand-ink:#ffffff; --brand-soft:#3a1d1d; --brand-text:#ff6961;
  --accent:#ff6961; --accent-soft:#3a1d1d;
  --ok:#30d158; --ok-soft:#173a22; --alert:#ff6961; --alert-soft:#3a1d1d;
  --redac:#ff6961; --redac-soft:#2a1f20;
  --sub:#d9b44a; --sub-ink:#1d1d1f;
  --av-1:#5e5ce6; --av-2:#0a84a0; --av-3:#636366; --av-4:#c93400; --av-5:#d30f45;
  --hero:#0e0e10; --hero-top:#2c2c2e;
  --note:#a78bfa; --note-ink:#140b2e;
  --blog:#9d9bff; --pro:#5ea2ff;
  --shadow:0 0 0 .5px rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.4);
  --shadow-lg:0 0 0 .5px rgba(255,255,255,.1),0 20px 50px -10px rgba(0,0,0,.7);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#161618; --surface:#232325; --surface-2:#2c2c2e; --surface-3:#2e1f1f;
  --glass:rgba(35,35,37,.72); --glass-strong:rgba(44,44,46,.86);
  --line:#38383a; --line-strong:#545456; --hairline:rgba(255,255,255,.08); --fill:rgba(255,255,255,.07); --fill-2:rgba(255,255,255,.11);
  --ink:#f5f5f7; --ink-2:#c7c7cc; --ink-3:#8e8e93;
  --brand:#eb0f0f; --brand-hover:#ff2d2d; --brand-ink:#ffffff; --brand-soft:#3a1d1d; --brand-text:#ff6961;
  --accent:#ff6961; --accent-soft:#3a1d1d;
  --ok:#30d158; --ok-soft:#173a22; --alert:#ff6961; --alert-soft:#3a1d1d;
  --redac:#ff6961; --redac-soft:#2a1f20;
  --sub:#d9b44a; --sub-ink:#1d1d1f;
  --av-1:#5e5ce6; --av-2:#0a84a0; --av-3:#636366; --av-4:#c93400; --av-5:#d30f45;
  --hero:#0e0e10; --hero-top:#2c2c2e;
  --note:#a78bfa; --note-ink:#140b2e;
  --blog:#9d9bff; --pro:#5ea2ff;
  --shadow:0 0 0 .5px rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.4);
  --shadow-lg:0 0 0 .5px rgba(255,255,255,.1),0 20px 50px -10px rgba(0,0,0,.7);
  color-scheme:dark }

*{box-sizing:border-box}
/* L'attribut hidden doit toujours l'emporter sur le display des composants (.field, .btn…) */
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 45%,transparent);outline-offset:1px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:1260px;margin:0 auto;padding-inline:16px}
.icon{width:18px;height:18px;flex:none}
.muted{color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}

/* Barre de maquette */
.proto{background:var(--ink);color:var(--bg);font-size:13px}
.proto .wrap{display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;padding-block:7px}
.proto-label{font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:11px;opacity:.85}
.proto-label b{background:var(--note);color:var(--note-ink);padding:2px 6px;border-radius:4px;margin-right:6px}
.seg{display:inline-flex;background:color-mix(in srgb,var(--bg) 14%,transparent);border-radius:8px;padding:2px}
.seg button{padding:3px 11px;border-radius:6px;font-size:12.5px;opacity:.8}
.seg button.on{background:var(--bg);color:var(--ink);opacity:1;font-weight:600}
.proto-spacer{flex:1}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:12.5px}
.switch .track{width:32px;height:18px;border-radius:999px;background:color-mix(in srgb,var(--bg) 30%,transparent);position:relative;transition:background .2s}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--bg);transition:transform .2s}
.switch.on .track{background:var(--note)}
.switch.on .track::after{transform:translateX(14px)}
.proto-link{font-size:12.5px;opacity:.8;text-decoration:underline;text-underline-offset:2px}

/* En-tête */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--hairline)}
.hdr-in{display:flex;align-items:center;gap:20px;height:62px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;flex:none}
/* Logo reconstitué d'après la home : pavé rouge, « LE » en réserve sur un pavé noir, « REVENU » sur le rouge.
   À remplacer par le SVG officiel à l'intégration. */
.lr-logo{font-size:22px;display:inline-flex;align-items:stretch;background:var(--rev-red);padding:.1em;flex:none}
.lr-logo span{font-family:var(--f-body);font-weight:900;font-size:1em;line-height:1;letter-spacing:-.02em;color:#fff;padding:.1em .1em .12em}
.lr-logo .lr-le{background:var(--rev-black);margin-right:.12em}
.brand-sep{width:1px;height:20px;background:var(--line-strong)}
.brand-sub{font-size:15px;font-weight:600;color:var(--ink-2)}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--fill);border:1px solid transparent;border-radius:10px;padding:0 12px;height:36px;color:var(--ink-3);font-size:14px;transition:background .15s,box-shadow .15s}
.search:focus-within{background:var(--surface);border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;height:100%}
.hdr-act{margin-left:auto;display:flex;align-items:center;gap:10px;position:relative}
.icon-btn{width:36px;height:36px;border-radius:9px;display:inline-grid;place-items:center;color:var(--ink-2);position:relative}
.icon-btn:hover{background:var(--fill);color:var(--ink)}
/* Pastille de compteur façon Dock : ancrée au coin haut droit de l'icône (et non du bouton), pour ne
   jamais recouvrir la cloche. Rouge de marque plein : --alert, éclairci en mode sombre, rendrait le
   chiffre blanc illisible. */
.dot-count{position:absolute;top:2px;left:calc(50% + 3px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--brand);color:#fff;font-size:10.5px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface),0 1px 2px rgba(0,0,0,.25);pointer-events:none}
.me-btn{display:flex;align-items:center;gap:8px;padding:3px 10px 3px 3px;border-radius:999px;border:1px solid var(--hairline);background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.me-btn:hover{background:var(--surface-2)}
.me-pts{font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:600;color:var(--accent)}
.search-mobile{display:none}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 16px;border:1px solid transparent;border-radius:10px;font-weight:600;font-size:14px;white-space:nowrap;transition:background-color .15s,box-shadow .15s,filter .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 82%,#fff),var(--brand));color:var(--brand-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 1px 2px color-mix(in srgb,var(--brand) 35%,transparent)}
.btn-primary:hover{filter:brightness(.93)}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--hairline);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.btn-secondary:hover{background:var(--surface-2)}
.btn-quiet{color:var(--ink-2)}
.btn-quiet:hover{background:var(--fill);color:var(--ink)}
.btn-sm{height:30px;padding:0 12px;font-size:13px;border-radius:8px}
.btn-block{width:100%}

/* Mise en page */
.layout{display:grid;grid-template-columns:212px minmax(0,1fr) 304px;gap:28px;padding-block:24px 96px;align-items:start}
.layout.no-right{grid-template-columns:212px minmax(0,1fr)}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);display:flex;flex-direction:column;gap:2px}
.main{min-width:0;display:flex;flex-direction:column;gap:18px}
.right{display:flex;flex-direction:column;gap:18px;min-width:0}
.nav-link{display:flex;align-items:center;gap:11px;padding:7px 10px;border-radius:var(--r-sm);color:var(--ink-2);font-weight:500;cursor:pointer;font-size:14px}
.nav-link:hover{background:var(--fill);color:var(--ink)}
.nav-link.on{background:var(--fill-2);color:var(--ink);font-weight:600}
.nav-link.on>.icon{color:var(--brand-text)}
/* Icône d'espace : tuile colorée à angles arrondis, comme dans la barre latérale des Réglages Système.
   La couleur identifie l'espace ; le texte à côté reste neutre. */
.sp-ic{--s:22px;width:var(--s);height:var(--s);border-radius:calc(var(--s) * .27);display:inline-grid;place-items:center;flex:none;color:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 78%,#fff),var(--c));box-shadow:inset 0 .5px 0 rgba(255,255,255,.35),0 .5px 1.5px rgba(0,0,0,.18)}
.sp-ic .icon{width:calc(var(--s) * .6);height:calc(var(--s) * .6);stroke-width:2.2}
.sp-ic.md{--s:40px}
.sp-ic.lg{--s:56px}
.nav-title{font-size:11.5px;font-weight:600;color:var(--ink-3);padding:18px 10px 6px;display:flex;align-items:center;gap:6px}
.nav-link .fav{margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--brand)}
.nav-foot:hover{color:var(--brand-text)}
.nav-foot .ext{width:13px;height:13px;margin-left:auto}
.nav-foot{margin-top:18px;padding:12px 10px 0;border-top:1px solid var(--hairline);font-size:13px;color:var(--ink-3);display:flex;align-items:center;gap:8px}

/* Cartes génériques */
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card-title{font-size:13px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-title>.icon{color:var(--brand-text)}
.card-title .more{margin-left:auto;font-size:13px;color:var(--brand-text);font-weight:500;cursor:pointer}
.card-title .more:hover{text-decoration:underline}
.section-title{font-family:var(--f-display);font-size:21px;font-weight:700;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}

/* Accueil */
.hero{background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--brand) 55%,transparent) 0%,transparent 55%),linear-gradient(160deg,var(--hero-top),var(--hero));color:#fff;border-radius:18px;padding:28px 28px 24px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 24px;align-items:end;position:relative;overflow:hidden;box-shadow:var(--shadow-lg)}
.hero h1{font-family:var(--f-display);font-size:32px;line-height:1.12;font-weight:700;max-width:22ch;letter-spacing:-.01em}
.hero p{color:rgba(255,255,255,.78);margin-top:8px;max-width:52ch}
.hero-stats{display:flex;gap:22px;margin-top:16px;font-size:13px;opacity:.9;flex-wrap:wrap}
.hero-stats b{display:block;font-variant-numeric:tabular-nums;font-size:20px;font-weight:700;color:#fff}
.hero-cta{display:flex;flex-direction:column;gap:8px}
.hero .btn-primary:hover{filter:brightness(1.08)}
.hero .btn-quiet{color:#fff;background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.hero .btn-quiet:hover{background:rgba(255,255,255,.24)}
.greet{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.greet h1{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:-.01em}
.streak{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13.5px;padding:5px 12px;border-radius:999px}
.quick{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r);padding:10px 12px;text-align:left;box-shadow:var(--shadow)}
.quick:hover{border-color:var(--line-strong)}
.quick-input{flex:1;background:var(--fill);border-radius:10px;padding:9px 14px;color:var(--ink-3);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quick-types{display:flex;gap:4px}
.quick-type{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:var(--r-sm);color:var(--ink-2);font-size:13.5px;font-weight:500}
.quick-type:hover{background:var(--fill)}
.tabs{display:inline-flex;align-self:flex-start;max-width:100%;gap:2px;padding:3px;background:var(--fill);border-radius:10px;overflow-x:auto;scrollbar-width:none}
.tab{display:inline-flex;align-items:center;gap:7px;padding:6px 14px;font-weight:500;font-size:14px;color:var(--ink-2);border-radius:8px;white-space:nowrap;transition:background .15s,box-shadow .15s}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.tab .cnt{font-variant-numeric:tabular-nums;font-size:11.5px;background:var(--alert-soft);color:var(--alert);padding:1px 7px;border-radius:999px}
.cat-scroller{display:none;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;border:1px solid var(--hairline);background:var(--surface);font-size:13.5px;font-weight:500;white-space:nowrap;color:var(--ink-2);cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}

/* Liste de discussions */
.feed{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.tcard{display:grid;grid-template-columns:62px minmax(0,1fr);gap:16px;padding:16px 18px;border-top:1px solid var(--line);cursor:pointer;transition:background .12s}
.tcard:first-child{border-top:0}
.tcard:hover{background:color-mix(in srgb,var(--surface-2) 70%,var(--surface))}
.tcard.pinned{background:var(--surface-3)}
.tcount{width:62px;height:58px;border-radius:var(--r-sm);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink-2);line-height:1.1}
.tcount b{font-variant-numeric:tabular-nums;font-size:19px;font-weight:600;color:var(--ink)}
.tcount span{font-size:10.5px;letter-spacing:.02em}
.tcount.solved{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.tcount.solved b{color:var(--surface);display:flex;align-items:center;gap:2px}
.tcount.solved .icon{width:14px;height:14px}
.tcount.zero{border-style:dashed;color:var(--alert)}
.tcount.zero b{color:var(--alert)}
.tcount.poll{background:var(--fill);border-color:transparent;color:var(--ink-2)}
.tcount.poll b{color:var(--ink)}
.tmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;margin-bottom:5px}
.cat-tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--brand-text);cursor:pointer}
.cat-tag:hover{color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600}
.tag .icon{width:12px;height:12px}
.tag-q{background:var(--fill);color:var(--ink-2)}
.tag-ok{background:var(--ok-soft);color:var(--ok)}
.tag-poll{background:var(--brand-soft);color:var(--brand-text)}
.tag-pin{background:var(--fill);color:var(--ink-2)}
.tag-redac{background:var(--redac);color:var(--surface)}
.tag-sub{background:var(--sub);color:var(--sub-ink)}
.tag-level{background:var(--fill);color:var(--ink-2);font-weight:500}
.tag-new{background:var(--brand);color:var(--brand-ink)}
.ttitle{font-family:var(--f-display);font-size:18.5px;line-height:1.3;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.tcard:hover .ttitle{color:var(--brand-text)}
.texcerpt{color:var(--ink-2);font-size:14px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tfoot{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--ink-3);flex-wrap:wrap}
.byline{display:inline-flex;align-items:center;gap:7px}
.byline b{color:var(--ink-2);font-weight:600}
.tstats{display:inline-flex;gap:14px;margin-left:auto;align-items:center}
.tstats span{display:inline-flex;align-items:center;gap:4px}
.tstats .icon{width:15px;height:15px}
.stack{display:inline-flex}
.stack .av{border:2px solid var(--surface);margin-left:-7px}
.stack .av:first-child{margin-left:0}

/* Avatars */
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:600;flex:none;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));letter-spacing:.02em;cursor:pointer;position:relative}
.av-xs{width:22px;height:22px;font-size:9.5px}
.av-sm{width:30px;height:30px;font-size:11.5px}
.av-md{width:40px;height:40px;font-size:14px}
.av-lg{width:56px;height:56px;font-size:20px}
.av-xl{width:84px;height:84px;font-size:28px}
.av img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.av.redac{border-radius:28%;font-family:var(--f-display);font-weight:900;letter-spacing:-.01em}

/* Widgets */
.w-q h3{font-family:var(--f-display);font-size:18px;line-height:1.3;font-weight:700;cursor:pointer;letter-spacing:-.01em}
.w-q h3:hover{color:var(--brand-text)}
.w-q .meta{font-size:13px;color:var(--ink-3);margin:8px 0 12px;display:flex;align-items:center;gap:8px}
.w-label{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--brand-text);margin-bottom:8px}
.poll{display:flex;flex-direction:column;gap:7px}
.popt{position:relative;display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:8px 12px;border-radius:var(--r-sm);border:1px solid var(--line);text-align:left;overflow:hidden;font-size:14px;font-weight:500;background:var(--surface)}
.popt:hover{border-color:var(--brand)}
.pradio{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-strong);flex:none}
.popt:hover .pradio{border-color:var(--brand)}
.popt.res{border-color:transparent;background:var(--fill)}
.pbar{position:absolute;inset:0 auto 0 0;width:var(--w);background:color-mix(in srgb,var(--ink) 8%,transparent);animation:grow .7s cubic-bezier(.2,.7,.3,1)}
.popt.mine .pbar{background:color-mix(in srgb,var(--brand) 22%,transparent)}
.plabel,.ppct{position:relative;display:flex;align-items:center;gap:6px}
.plabel{flex:1;min-width:0}
.ppct{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600}
.popt.mine{font-weight:700}
.popt.mine .icon{width:15px;height:15px;color:var(--brand-text)}
.pfoot{font-size:12.5px;color:var(--ink-3);margin-top:3px}
@keyframes grow{from{width:0}}
.ev{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ev:first-of-type{border-top:0;padding-top:0}
.ev-date{border-radius:10px;background:var(--surface);border:1px solid var(--hairline);box-shadow:var(--shadow);text-align:center;padding:0 0 5px;line-height:1.1;height:fit-content;overflow:hidden}
.ev-date small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#fff;background:var(--brand);font-weight:700;padding:3px 0;margin-bottom:4px}
.ev-date b{font-variant-numeric:tabular-nums;font-size:19px}
.ev h4{margin:0;font-size:14.5px;line-height:1.35}
.ev p{font-size:12.5px;color:var(--ink-3);margin:2px 0 8px}
.ev .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn-going{background:var(--ok-soft);color:var(--ok)}
.top-row{display:flex;align-items:center;gap:10px;padding:7px 0}
.top-rank{width:20px;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-3);text-align:center;font-size:13px}
.top-row:nth-child(-n+3) .top-rank{color:var(--accent)}
.top-name{flex:1;min-width:0;font-weight:600;font-size:14px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-name small{display:block;font-weight:400;color:var(--ink-3);font-size:12px}
.top-pts{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;color:var(--accent)}
.progress{height:6px;border-radius:999px;background:var(--fill);overflow:hidden}
.progress span{display:block;height:100%;background:linear-gradient(90deg,color-mix(in srgb,var(--brand) 60%,#ff9f0a),var(--brand));border-radius:inherit;transition:width .6s}
.prog-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.prog-head h3{font-size:16px}
.prog-head small{display:block;color:var(--ink-3);font-size:13px}
.prog-meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-3);margin-top:7px}
.prog-badges{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.join-card{background:linear-gradient(180deg,var(--brand-soft),var(--surface) 70%)}
.join-card h3{font-family:var(--f-display);font-size:19px;margin-bottom:6px;letter-spacing:-.01em}
.join-card ul{margin:10px 0 14px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink-2)}
.join-card li{display:flex;gap:8px;align-items:flex-start}
.join-card li .icon{color:var(--brand-text);margin-top:2px;width:16px;height:16px}
.inline-mod{display:none}
.feed .inline-mod{border:0;border-top:1px solid var(--line);border-radius:0;background:var(--surface-2)}

/* Badges */
.bdg{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.bdg .icon{width:16px;height:16px}
.bdg.lg{width:52px;height:52px}
.bdg.lg .icon{width:24px;height:24px}
.bdg.locked{background:var(--surface-2);color:var(--ink-3);opacity:.7}

/* Discussion */
.crumbs{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink-3);flex-wrap:wrap}
.crumbs a{cursor:pointer}
.crumbs a:hover{color:var(--ink)}
.crumbs .icon{width:14px;height:14px}
.post{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r);padding:20px 22px;scroll-margin-top:90px;box-shadow:var(--shadow)}
.post-main h1{font-family:var(--f-display);font-size:29px;line-height:1.2;font-weight:700;margin:6px 0 14px;letter-spacing:-.01em}
.author{display:flex;align-items:center;gap:11px}
.author-name{font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap;cursor:pointer}
.author-sub{font-size:12.5px;color:var(--ink-3)}
.prose{margin-top:14px;font-size:15.5px;line-height:1.65;max-width:68ch;overflow-wrap:anywhere}
.prose p+p,.prose p+ul,.prose ul+p{margin-top:.8em}
.prose ul{margin:.5em 0;padding-left:1.2em}
.prose strong{font-weight:600}
.prose .mention{color:var(--brand-text);font-weight:600;background:var(--brand-soft);padding:0 4px;border-radius:0;cursor:pointer}
.article-link{display:flex;gap:14px;align-items:center;margin-top:16px;padding:12px 14px;border:1px solid var(--hairline);border-radius:12px;background:var(--surface-2);max-width:68ch}
.article-link .thumb{width:54px;height:54px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:22px;flex:none;letter-spacing:-.01em;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
a.article-link:hover{border-color:var(--line-strong);background:var(--surface)}
.al-cta{display:inline-flex;align-items:center;gap:4px;margin-top:4px;font-size:12.5px;font-weight:600;color:var(--brand-text)}
.al-cta .icon{width:13px;height:13px}
.article-link small{font-size:12px;color:var(--ink-3);font-weight:600}
.article-link b{display:block;font-family:var(--f-display);font-size:16px;line-height:1.3;letter-spacing:-.01em}
.actions{display:flex;align-items:center;gap:4px;margin-top:16px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.act:hover{background:var(--fill);color:var(--ink)}
.act.useful{border:1px solid var(--hairline);background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.act.useful.on{background:var(--brand-soft);border-color:transparent;color:var(--brand-text)}
.act.useful.on .icon{animation:pop .35s}
.act.on-ok{background:var(--ok-soft);color:var(--ok)}
.act.followed{color:var(--brand-text)}
.act.subtle{color:var(--ink-3);margin-left:auto}
@keyframes pop{50%{transform:scale(1.35) rotate(-12deg)}}
.solution-call{display:flex;gap:12px;align-items:flex-start;background:var(--ok-soft);border-radius:var(--r);padding:14px 16px;color:var(--ink);cursor:pointer;text-align:left;width:100%}
.solution-call .icon{color:var(--ok);margin-top:2px}
.solution-call b{color:var(--ok)}
.solution-call p{font-size:14px;color:var(--ink-2);margin-top:2px}
.replies{display:flex;flex-direction:column;gap:12px}
.post.reply{padding:16px 20px}
.post.reply .prose{font-size:15px;margin-top:10px}
.post.is-solution{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok),var(--shadow)}
.post.is-redac{background:var(--redac-soft);border-color:color-mix(in srgb,var(--redac) 35%,var(--line))}
.post.flash{animation:flash 1.6s}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--brand)}}
.post-flag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;margin-bottom:10px}
.post-flag.ok{color:var(--ok)}
.post-flag.redac{color:var(--redac)}
.post-flag .icon{width:14px;height:14px}
.reply-box{display:flex;flex-direction:column;gap:10px}
.reply-box textarea{width:100%;min-height:110px;resize:vertical;border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;background:var(--surface);line-height:1.5}
.reply-box textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
.reply-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--ink-3)}
.reply-login{text-align:center;padding:26px 20px;display:flex;flex-direction:column;gap:10px;align-items:center}
.reply-login h3{font-family:var(--f-display);font-size:19px;letter-spacing:-.01em}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.facts div small{display:block;font-size:12px;color:var(--ink-3)}
.facts div b{font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.cat-card h3{font-family:var(--f-display);font-size:18px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.cat-card p{font-size:14px;color:var(--ink-2);margin:6px 0 12px}
.help-card{background:var(--surface-3);border-color:transparent}
.help-card h3{font-size:15.5px;margin-bottom:4px}
.help-card p{font-size:13.5px;color:var(--ink-2);margin-bottom:12px}

/* Espace */
.cat-head{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r);padding:22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.cat-head h1{font-family:var(--f-display);font-size:28px;font-weight:700;letter-spacing:-.01em}
.cat-head p{color:var(--ink-2);margin-top:4px;max-width:60ch}
.cat-head .stats{font-size:13px;color:var(--ink-3);margin-top:8px;display:flex;gap:14px;flex-wrap:wrap}
.cat-head .grow{flex:1;min-width:220px}
.spaces-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.space{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r);padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.space:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.space .sp-ic{margin-bottom:6px}
.space h3{font-family:var(--f-display);font-size:18px;letter-spacing:-.01em}
.space p{font-size:13.5px;color:var(--ink-2);flex:1}
.space small{font-size:12.5px;color:var(--ink-3)}

/* Profil */
.prof{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.prof h1{font-family:var(--f-display);font-size:28px;font-weight:700;letter-spacing:-.01em}
.prof .grow{flex:1;min-width:220px}
.prof .sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--ink-3);margin-top:4px}
.prof .bio{margin-top:10px;color:var(--ink-2);max-width:60ch}
.stats-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r);padding:14px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-variant-numeric:tabular-nums;font-size:22px;font-weight:600}
.stat small{font-size:12.5px;color:var(--ink-3)}
.stat.score b{color:var(--accent)}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge-item{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:14px 10px;border-radius:12px;border:1px solid var(--hairline);background:var(--surface)}
.badge-item b{font-size:14px}
.badge-item small{font-size:12px;color:var(--ink-3);line-height:1.35}
.badge-item.locked b{color:var(--ink-3)}
.levels{display:flex;gap:6px;margin-top:14px}
.levels div{flex:1;text-align:center;font-size:11.5px;color:var(--ink-3);padding-top:8px;border-top:4px solid var(--fill-2);line-height:1.3}
.levels div.done{border-color:var(--accent);color:var(--ink-2)}
.levels div.cur{border-color:var(--accent);color:var(--ink);font-weight:600}
.rlist{display:flex;flex-direction:column}
.ritem{padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.ritem:first-child{border-top:0;padding-top:0}
.ritem b{font-weight:600;font-size:14.5px}
.ritem p{font-size:13.5px;color:var(--ink-2);margin-top:3px}

/* Classement */
.page-head h1{font-family:var(--f-display);font-size:28px;font-weight:700;letter-spacing:-.01em}
.page-head p{color:var(--ink-2);margin-top:6px;max-width:62ch}
.lb{list-style:none;margin:0;padding:0}
.lb li{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line)}
.lb li:first-child{border-top:0}
.lb li.me{background:var(--accent-soft)}
.lb .rank{width:30px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-3)}
.lb .medal{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;color:#fff;font-variant-numeric:tabular-nums}
.lb .m1{background:var(--brand)}.lb .m2{background:var(--av-1)}.lb .m3{background:var(--av-3)}
.lb .who{flex:1;min-width:0;cursor:pointer}
.lb .who b{display:block;font-size:14.5px}
.lb .who small{color:var(--ink-3);font-size:12.5px}
.lb .pts{font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.plist li{display:flex;justify-content:space-between;gap:10px}
.plist b{font-variant-numeric:tabular-nums;color:var(--accent)}

/* Charte */
.rules{counter-reset:r;display:flex;flex-direction:column;gap:12px;list-style:none;margin:0;padding:0}
.rules li{counter-increment:r;display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.rules li::before{content:counter(r);width:36px;color:var(--brand-text);font-family:var(--f-display);font-size:30px;line-height:1;font-weight:900;text-align:center}
.rules h3{font-size:16px}
.rules p{color:var(--ink-2);font-size:14.5px;margin-top:2px}

/* Menus déroulants */
.dropdown{position:absolute;top:calc(100% + 8px);right:0;width:min(380px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--hairline);border-radius:12px;box-shadow:var(--shadow-lg);z-index:60;overflow:hidden}
.dd-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--hairline)}
.dd-head b{font-size:15px}
.dd-head button{font-size:13px;color:var(--brand-text);font-weight:600}
.notif{display:flex;gap:11px;padding:12px 16px;border-top:1px solid var(--hairline);cursor:pointer;font-size:14px;line-height:1.4}
.notif:first-of-type{border-top:0}
.notif:hover{background:var(--fill)}
.notif.unread{background:color-mix(in srgb,var(--brand) 6%,transparent)}
.notif small{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}
.notif .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.ic-like{background:var(--brand-soft);color:var(--brand-text)}
.ic-badge{background:var(--accent-soft);color:var(--accent)}
.ic-ok{background:var(--ok-soft);color:var(--ok)}
.ic .icon{width:15px;height:15px}
.menu-list{padding:6px}
.menu-list button,.menu-list a{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:6px;font-size:14px;text-align:left}
.menu-list button:hover,.menu-list a:hover{background:var(--brand);color:#fff}
.menu-me{padding:14px 16px;border-bottom:1px solid var(--hairline);display:flex;gap:10px;align-items:center}

/* Modales */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:80;display:grid;place-items:center;padding:16px;animation:fade .15s}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);width:min(640px,100%);max-height:calc(100dvh - 32px);overflow:auto;animation:rise .2s}
.modal.sm{width:min(440px,100%)}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 0}
.m-head h2{font-family:var(--f-display);font-size:23px;letter-spacing:-.01em}
.m-body{padding:16px 22px 22px;display:flex;flex-direction:column;gap:16px}
.m-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 22px;border-top:1px solid var(--hairline);position:sticky;bottom:0;background:var(--surface);flex-wrap:wrap}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(12px);opacity:0}}
.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.type{position:relative;border:1.5px solid var(--line);border-radius:12px;padding:14px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.type input{position:absolute;opacity:0;pointer-events:none}
.type:hover{border-color:var(--line-strong)}
.type:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.type:has(input:focus-visible){outline:2px solid var(--brand);outline-offset:2px}
.type .icon{color:var(--brand-text);width:22px;height:22px;margin-bottom:4px}
.type b{font-size:14.5px}
.type small{font-size:12.5px;color:var(--ink-3);line-height:1.35}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field-label{font-weight:600;font-size:14px}
.field-label em{font-weight:400;color:var(--ink-3);font-style:normal}
.input{width:100%;height:40px;border:1px solid var(--line);border-radius:var(--r-sm);padding:0 12px;background:var(--surface)}
textarea.input{height:auto;padding:10px 12px;resize:vertical;line-height:1.5}
.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
.input.err{border-color:var(--alert)}
.err-msg{color:var(--alert);font-size:13px}
.similar{background:var(--accent-soft);border-radius:var(--r-sm);padding:12px 14px}
.similar b{font-size:13.5px;display:flex;align-items:center;gap:6px}
.similar a{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid color-mix(in srgb,var(--accent) 20%,transparent);font-size:14px;cursor:pointer}
.similar a:first-of-type{border-top:0;margin-top:6px}
.similar a:hover span{text-decoration:underline}
.similar a small{color:var(--ink-3);white-space:nowrap}
.opt-row{display:flex;gap:8px}
.opt-row .input{flex:1}
.compliance{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-2);background:var(--surface-2);padding:10px 12px;border-radius:var(--r-sm)}
.compliance .icon{width:16px;height:16px;margin-top:1px;color:var(--ink-3)}
.compliance a{color:var(--brand-text);font-weight:600;cursor:pointer}
details.more summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--brand-text);list-style:none;display:flex;align-items:center;gap:6px}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:8px}
.sso{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2)}
.sso .logo{width:38px;height:38px;border-radius:9px;background:var(--rev-red);color:#fff;display:grid;place-items:center;font-family:var(--f-body);font-weight:900;font-size:20px;letter-spacing:-.02em;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.sso small{display:block;color:var(--ink-3);font-size:12.5px}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:4px;border-radius:999px;background:var(--fill-2)}
.steps span.on{background:var(--brand)}
.interests{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.interest{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1.5px solid var(--line);border-radius:var(--r-sm);cursor:pointer;font-weight:500;font-size:14px}
.interest input{position:absolute;opacity:0;pointer-events:none}

const user = n => USERS[n];
const initials = u => u.role === 'redaction' ? 'R' : u.name.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const av = (u, size = 'sm', link = true) => `<span class="av av-${size} ${u.role === 'redaction' ? 'redac' : ''} ${u.pro ? 'pro' : ''}" style="--c:${u.color}" ${link ? `data-act="profile" data-u="${esc(u.username)}"` : ''} title="${esc(u.name)}">${u.photo ? `<img src="${esc(u.photo)}" alt="">` : esc(size === 'xs' ? initials(u)[0] : initials(u))}</span>`;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function roleTags(u, withLevel = true) {
  if (u.role === 'redaction') return `<span class="tag tag-redac">${icon('check')}Rédaction</span>`;
  if (u.role === 'moderator') return `<span class="tag tag-q">${icon('shield')}Modération</span>`;
  return (u.pro ? `<span class="tag tag-pro">${icon('verified')}Expertise vérifiée</span>` : '') + (u.sub ? `<span class="tag tag-sub">Abonné</span>` : '') + (withLevel ? `<span class="tag tag-level">${esc(lvl(u.points).name)}</span>` : '');
}
const MONTHS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const memberSince = u => u.since || (h => `${MONTHS[h % 12]} ${2019 + h % 7}`)([...u.username].reduce((a, c) => a + c.charCodeAt(0), 0));
const memberStats = u => u.stats || { topics: TOPICS.filter(t => t.author === u.username).length, replies: Math.round(u.points / 7), likes: Math.round(u.points / 4), solutions: Math.round(u.points / 120), votes: 0 };

/* Liens : sources de confiance cliquables, les autres refusés ou soumis à la modération. Tous en rel="ugc nofollow". */
const TRUSTED = ['lerevenu.com', 'gouv.fr', 'service-public.fr', 'amf-france.org', 'banque-france.fr', 'insee.fr', 'info-retraite.fr', 'ecb.europa.eu', 'ccomptes.fr'];
const LINK_RE = /\b(?:https?:\/\/|www\.)[^\s<]+|\b[a-z0-9][a-z0-9-]*(?:\.[a-z0-9-]+)*\.(?:com|fr|net|org|eu|io|info|be|ch|co)\b(?:\/[^\s<]*)?/gi;
const cleanLink = raw => raw.replace(/[.,;:!?)»]+$/, '');
const hostOf = raw => raw.replace(/^https?:\/\//i, '').replace(/^www\./i, '').split(/[/?#]/)[0].toLowerCase();
const trusted = host => TRUSTED.some(d => host === d || host.endsWith('.' + d));
const canPostExternal = () => S.me.role === 'redaction' || lvl(S.me.points).i >= 3;
function renderLink(raw) {
  const url = cleanLink(raw), rest = raw.slice(url.length), host = hostOf(url);
  if (!trusted(host)) return `<span class="link-pending" title="Lien en attente de validation par la modération">${url}<small> · lien en attente de validation</small></span>${rest}`;
  const shown = url.replace(/^https?:\/\//i, '').replace(/^www\./i, '');
  return `<a class="ugc-link" href="${/^https?:/i.test(url) ? url : 'https://' + url}" target="_blank" rel="ugc nofollow noopener">${shown.length > 48 ? shown.slice(0, 46) + '…' : shown}</a>${rest}`;
}

/* Indexation sélective : la décision porte sur la page entière. */
const SEO_USEFUL = 25;
const isExpert = u => u.role === 'redaction' || !!u.pro;
function seoStatus(t) {
  const useful = t.likes + t.replies.reduce((a, r) => a + r.likes, 0);
  const sol = t.solution ? t.replies.find(r => r.id === t.solution) : null;
  const expert = [t.author, ...t.replies.map(r => r.author)].map(user).find(isExpert);
  const checks = [
    ['Espace indexable (hors Café du Revenu)', t.cat !== 'cafe'],
    ['Meilleure réponse choisie', !!sol],
    ['Contribution de la rédaction ou d\'un expert vérifié', !!expert],
    [`Au moins ${SEO_USEFUL} « Utile » et deux réponses`, useful >= SEO_USEFUL && t.replies.length >= 2],
  ];
  let on = false, reason;
  if (t.cat === 'cafe') reason = 'Espace de discussion libre : jamais indexé';
  else if (sol) { on = true; reason = sol.verified ? 'Meilleure réponse vérifiée par la rédaction' : 'Meilleure réponse choisie'; }
  else if (expert) { on = true; reason = expert.role === 'redaction' ? 'Contribution de la rédaction' : 'Réponse d\'un expert vérifié'; }
  else if (checks[3][1]) { on = true; reason = `Discussion jugée utile (${useful} « Utile »)`; }
  else reason = t.replies.length ? 'Pas encore assez de signaux de qualité' : 'Pas encore de réponse';
  return { on, reason, checks };
}
const blogSeo = b => b.likes >= 20 ? { on: true, reason: 'Billet apprécié des lecteurs' } : { on: false, reason: 'En attente de relecture par la rédaction' };
const seoPill = (st, fem = true) => S.staff ? `<span class="tag ${st.on ? 'tag-idx' : 'tag-noidx'}" title="${esc(st.reason)}">${icon(st.on ? 'globe' : 'eyeoff')}${st.on ? (fem ? 'Indexée' : 'Indexé') : (fem ? 'Non indexée' : 'Non indexé')}</span>` : '';

const spIcon = (c, size = '') => `<span class="sp-ic ${size}" style="--c:${c.color}">${icon(c.icon)}</span>`;
const catTag = slug => { const c = cat(slug); return `<span class="cat-tag" data-act="cat" data-slug="${c.slug}">${esc(c.name)}</span>`; };
function typeTag(t) {
  if (t.type === 'question') return t.solution ? `<span class="tag tag-ok">${icon('check')}Résolu</span>` : `<span class="tag tag-q">Question</span>`;
  if (t.type === 'poll') return `<span class="tag tag-poll">${icon('chart')}Sondage</span>`;
  return '';
}
const pin = key => S.notes ? `<button class="pin" data-act="note" data-note="${key}" aria-label="Note de conception ${NOTE_KEYS.indexOf(key) + 1}">${NOTE_KEYS.indexOf(key) + 1}</button>` : '';
const bdg = (code, cls = '') => `<span class="bdg ${cls}" title="${esc(BADGES[code][0])}">${icon(BADGES[code][2])}</span>`;
const plain = text => text.replace(/\*\*/g, '').replace(/\n+/g, ' ');
const readTime = text => Math.max(1, Math.round(text.split(/\s+/).length / 200));
const dkey = () => S.view + ':' + S.arg;
const lastMin = t => t.replies.length ? Math.min(...t.replies.map(r => r.min)) : t.min;
const totalVotes = t => t.options.reduce((a, o) => a + o.votes, 0);

function formatBody(text) {
  const inline = s => s.replace(LINK_RE, renderLink).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])@([A-Za-z0-9_\-]+(?:\.[A-Za-z0-9_\-]+)*)/g, (m, pre, n) => USERS[n] ? `${pre}<span class="mention" data-act="profile" data-u="${n}">@${n}</span>` : m);
  return esc(text).split(/\n{2,}/).map(block => {
    const lines = block.split('\n');
    if (lines.every(l => /^- /.test(l))) return '<ul>' + lines.map(l => `<li>${inline(l.slice(2))}</li>`).join('') + '</ul>';
    const items = lines.filter(l => /^- /.test(l));
    if (items.length) {
      const head = lines.filter(l => !/^- /.test(l));
      return `<p>${inline(head.join('<br>'))}</p><ul>${items.map(l => `<li>${inline(l.slice(2))}</li>`).join('')}</ul>`;
    }
    return `<p>${inline(lines.join('<br>'))}</p>`;
  }).join('');
}

function topicCard(t, withPin = false) {
  const u = user(t.author);
  const n = t.replies.length;
  let box;
  if (t.type === 'poll') box = `<div class="tcount poll"><b class="num">${fmt(totalVotes(t))}</b><span>votes</span></div>`;
  else if (t.solution) box = `<div class="tcount solved"><b class="num">${icon('check')}${n}</b><span>réponse${n > 1 ? 's' : ''}</span></div>`;
  else box = `<div class="tcount ${n ? '' : 'zero'}"><b class="num">${n}</b><span>réponse${n > 1 ? 's' : ''}</span></div>`;
  const people = [...new Set(t.replies.map(r => r.author))].slice(-4).map(x => av(user(x), 'xs')).join('');
  return `<article class="tcard ${t.pinned ? 'pinned' : ''}" data-act="open" data-id="${t.id}">
    <div>${box}</div>
    <div>
      <div class="tmeta">${catTag(t.cat)}${typeTag(t)}${t.pinned ? `<span class="tag tag-pin">${icon('pin')}Épinglé</span>` : ''}${t.min < 60 * 6 && !t.replies.length ? '<span class="tag tag-new">Nouveau</span>' : ''}${seoPill(seoStatus(t))}${withPin ? pin('card') : ''}</div>
      <h3 class="ttitle">${esc(t.title)}</h3>
      <p class="texcerpt">${esc(t.body.replace(/\*\*/g, '').replace(/\n+/g, ' '))}</p>
      <div class="tfoot">
        <span class="byline">${av(u, 'xs')}<b>${esc(u.name)}</b>${u.role === 'redaction' ? roleTags(u) : ''}<span>· ${ago(t.min)}</span></span>
        <span class="tstats">
          ${people ? `<span class="stack">${people}</span>` : ''}
          <span title="Utile">${icon('thumb')}<span class="num">${t.likes}</span></span>
          <span class="views" title="Vues">${icon('eye')}<span class="num">${fmt(t.views)}</span></span>
        </span>
      </div>
    </div>
  </article>`;
}

const cover = (b, cls) => { const c = b.cat ? cat(b.cat) : { color: 'var(--blog)', icon: 'pen' }; return `<div class="${cls}" style="--c:${c.color}" aria-hidden="true">${icon(c.icon)}</div>`; };
function blogCard(b, withAuthor = true) {
  const u = user(b.author);
  return `<article class="bcard" data-act="openpost" data-id="${b.id}">
    <div>
      <div class="tmeta"><span class="tag tag-blog">${icon('pen')}Billet</span>${b.cat ? catTag(b.cat) : ''}${seoPill(blogSeo(b), false)}</div>
      <h3 class="ttitle">${esc(b.title)}</h3>
      <p class="texcerpt">${esc(plain(b.body))}</p>
      <div class="tfoot">
        <span class="byline">${withAuthor ? `${av(u, 'xs')}<b>${esc(u.name)}</b><span>· ${ago(b.min)}</span>` : `<span>${cap(ago(b.min))}</span>`}<span>· ${readTime(b.body)} min de lecture</span></span>
        <span class="tstats"><span title="Utile">${icon('thumb')}<span class="num">${b.likes}</span></span><span title="Commentaires">${icon('msg')}<span class="num">${b.comments.length}</span></span></span>

function topicRow(t) {
  const n = t.replies.length, c = cat(t.cat);
  const count = t.solution ? `<span class="ok">${icon('check')}${n}</span>` : `<span class="${n ? '' : 'zero'}">${n}</span>`;
  return `<div class="trow ${t.pinned ? 'pinned' : ''}" data-act="open" data-id="${t.id}">
    <span class="tt">${spIcon(c)}<span class="tt-main"><b>${esc(t.title)}</b><span class="tt-meta"><small>${esc(c.name)} · ${esc(user(t.author).name)}</small>${typeTag(t)}${t.pinned ? `<span class="tag tag-pin">${icon('pin')}Épinglé</span>` : ''}${t.min < 60 * 6 && !n ? '<span class="tag tag-new">Nouveau</span>' : ''}${seoPill(seoStatus(t))}</span></span></span>
    <span class="c-num">${count}</span>
    <span class="c-num c-views">${fmtK(t.views)}</span>
    <span class="c-num" title="Dernière activité ${ago(lastMin(t))}">${shortAgo(lastMin(t))}</span>
  </div>`;
}

function pollHTML(t) {
  const total = totalVotes(t), voted = t.myVote != null;
  return `<div class="poll">${t.options.map((o, i) => {
    const pct = total ? Math.round(o.votes * 100 / total) : 0, mine = t.myVote === i;
    return voted
      ? `<button class="popt res ${mine ? 'mine' : ''}" data-act="vote" data-id="${t.id}" data-i="${i}"><span class="pbar" style="--w:${pct}%"></span><span class="plabel">${mine ? icon('check') : ''}${esc(o.label)}</span><span class="ppct">${pct} %</span></button>`
      : `<button class="popt" data-act="vote" data-id="${t.id}" data-i="${i}"><span class="pradio"></span><span class="plabel">${esc(o.label)}</span></button>`;
  }).join('')}<p class="pfoot"><span class="num">${fmt(total)}</span> votes · ${voted ? 'Touchez une autre réponse pour changer d\'avis' : 'Votez pour voir les résultats'}</p></div>`;
}

/* ====================== Vues ====================== */
function hot(t) {
  const score = 1 + t.replies.length * 3 + t.likes * 2 + t.views / 25 + (t.options ? totalVotes(t) / 20 : 0);
  return score / Math.pow((t.min + lastMin(t)) / 120 + 2, 1.3);
}
function feedList(tab, slug) {
  let list = TOPICS.filter(t => !slug || t.cat === slug);
  if (tab === 'foryou' && S.logged && (S.me.interests || []).length) list = list.filter(t => S.me.interests.includes(t.cat) || t.featured || t.author === S.me.username);
  if (tab === 'unanswered') return list.filter(t => !t.replies.length && t.type !== 'poll').sort((a, b) => a.min - b.min);
  if (tab === 'new') list = [...list].sort((a, b) => a.min - b.min);
  else list = [...list].sort((a, b) => hot(b) - hot(a));
  if (slug || tab === 'new') list.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
  else list = list.filter(t => !t.pinned || !S.logged);
  return list;
}
function tabsHTML(tab, slug) {
  const unanswered = TOPICS.filter(t => (!slug || t.cat === slug) && !t.replies.length && t.type !== 'poll').length;
  const tabs = [];
  if (S.logged && !slug) tabs.push(['foryou', 'spark', 'Pour vous']);
  tabs.push(['hot', 'trend', 'Tendances'], ['new', 'clock', 'Récentes'], ['unanswered', 'help', 'Sans réponse']);
  const bar = `<div class="tabs" role="tablist">${tabs.map(([k, ic, l]) => `<button class="tab ${tab === k ? 'on' : ''}" role="tab" aria-selected="${tab === k}" data-act="tab" data-tab="${k}">${icon(ic)}${l}${k === 'unanswered' && unanswered ? `<span class="cnt">${unanswered}</span>` : ''}</button>`).join('')}<span style="align-self:center;margin-left:4px">${pin('tabs')}</span></div>`;
  const view = (d, ic, label) => `<button class="${S.density === d ? 'on' : ''}" data-act="density" data-d="${d}" aria-pressed="${S.density === d}" aria-label="${label}" title="${label}">${icon(ic)}</button>`;
  return `<div class="feed-bar">${bar}<span style="display:flex;align-items:center;gap:6px">${pin('density')}<span class="seg-ic" role="group" aria-label="Affichage de la liste">${view('comfy', 'rows', 'Vue détaillée')}${view('compact', 'list', 'Vue compacte')}</span></span></div>`;
}

    <section class="card"><h2 class="card-title">Cette discussion</h2>
      <div class="facts"><div><small>Réponses</small><b>${n}</b></div><div><small>Utile</small><b>${t.likes + t.replies.reduce((a, r) => a + r.likes, 0)}</b></div><div><small>Vues</small><b>${fmt(t.views)}</b></div><div><small>Dernière activité</small><b style="font-size:13.5px;font-family:var(--f-body)">${ago(lastMin(t))}</b></div></div>

function viewProfile(username) {
  const u = user(username), L = lvl(u.points), isMe = S.logged && S.me.username === username, member = u.role === 'member';
  const pct = L.next ? Math.round((u.points - L.min) * 100 / (L.next - L.min)) : 100;
  const st = memberStats(u);
  const owned = u.badges || new Set(Object.keys(BADGES).slice(0, Math.min(9, Math.round(u.points / 80) + 2)));
  const topics = TOPICS.filter(t => t.author === username);
  const replies = TOPICS.flatMap(t => t.replies.filter(r => r.author === username).map(r => ({ r, t })));
  const blogs = BLOGS.filter(b => b.author === username);
  const tabs = [['blog', 'pen', 'Billets', blogs.length], ['topics', 'msg', 'Discussions', null], ['replies', 'reply', 'Réponses', null]];
  if (member) tabs.push(['progress', 'trophy', 'Progression', null]);
  const tab = tabs.some(x => x[0] === S.tab) ? S.tab : (blogs.length || isMe ? 'blog' : 'topics');
  const empty = (title, text, btn = '') => `<div class="card empty"><h3>${title}</h3><p>${text}</p>${btn}</div>`;
  let body;

    : empty('Aucune réponse', isMe ? 'Aidez un membre : les questions sans réponse vous attendent.' : `${esc(u.name)} n'a pas encore répondu à une discussion.`);

      <div class="progress"><span style="width:${pct}%"></span></div>
      <div class="levels">${LEVELS.map((l, i) => `<div class="${i < L.i ? 'done' : i === L.i ? 'cur' : ''}">${esc(l[1])}<br><span class="num">${l[0]}</span></div>`).join('')}</div>
    </section>
    <section class="card"><h2 class="card-title">Badges <span class="num" style="letter-spacing:0">${owned.size}/${Object.keys(BADGES).length}</span> ${pin('rewards')}</h2>
      <div class="badge-grid">${Object.entries(BADGES).map(([k, b]) => `<div class="badge-item ${owned.has(k) ? '' : 'locked'}">${bdg(k, 'lg' + (owned.has(k) ? '' : ' locked'))}<b>${esc(b[0])}</b><small>${esc(b[1])}</small></div>`).join('')}</div>

/* ====================== Rendu ====================== */
function render(top = false) {
  closeMention(); hideCard();
  $('#proto').innerHTML = protoBar();
  $('#sitebar').innerHTML = siteBar();
  $('#hdr').innerHTML = header();
  let out;
  switch (S.view) {
    case 'cat': out = viewCategory(S.arg); break;
    case 'topic': out = viewTopic(S.arg); break;
    case 'profile': out = viewProfile(S.arg); break;
    case 'post': out = viewPost(S.arg); break;
    case 'spaces': out = viewSpaces(); break;
    case 'leaderboard': out = viewLeaderboard(); break;
    case 'charter': out = viewCharter(); break;
    case 'search': out = viewSearch(); break;
    default: out = viewHome();
  }
  const [main, right, active] = out;
  $('#app').innerHTML = `<div class="layout ${right ? '' : 'no-right'}">${sideNav(active)}<main class="main" id="main">${main}</main>${right ? `<aside class="right">${right}</aside>` : ''}</div>`;
  const unread = S.notifs.filter(n => !n.read).length;
  const on = v => S.view === v ? 'on' : '';
  $('#bnav').innerHTML = `
    <button class="${on('home')}" data-act="home">${icon('home')}Accueil</button>
    <button class="${on('spaces')}${on('cat')}" data-act="go" data-view="spaces">${icon('grid')}Espaces</button>
    <button data-act="compose" aria-label="Publier"><span class="plus">${icon('plus')}</span></button>
    <button data-act="${S.logged ? 'menu' : 'login'}" data-menu="notifs">${icon('bell')}Activité${unread ? `<span class="dot-count">${unread}</span>` : ''}</button>
    <button class="${on('profile')}" data-act="${S.logged ? 'profile' : 'login'}" data-u="${S.logged ? esc(S.me.username) : ''}">${icon('user')}${S.logged ? 'Profil' : 'Connexion'}</button>
    ${S.notes ? `<span style="position:absolute;right:6px;top:-12px">${pin('mobile')}</span>` : ''}`;
  if (top) window.scrollTo({ top: 0 });
}
function go(view, arg = null, tab = null) { S.view = view; S.arg = arg; S.tab = tab; S.menu = null; render(true); }

/* ====================== Récompenses et toasts ====================== */
function toast(html, cls = '', ms = 4200) {
  const el = document.createElement('div');
  el.className = 'toast ' + cls; el.innerHTML = html;
  $('#toasts').appendChild(el);
  setTimeout(() => el.classList.add('out'), ms);
  setTimeout(() => el.remove(), ms + 350);
  return el;
}
function award(pts, reason) {
  const me = S.me, before = lvl(me.points).i;
  me.points += pts; me.month += pts;
  toast(`<span class="pts">+${pts}</span><div>${esc(reason)}<small>${me.points} points au total</small></div>`);
  if (lvl(me.points).i > before) setTimeout(() => {
    toast(`${icon('trophy')}<div><b>Niveau supérieur !</b><small>Vous êtes maintenant « ${esc(lvl(me.points).name)} »</small></div>`, 'level', 5200);
    S.notifs.unshift({ id: Date.now(), kind: 'level', text: `Vous passez au niveau « ${lvl(me.points).name} »`, min: 0, read: false });
  }, 700);
}
function badge(code) {
  const me = S.me;
  if (me.badges.has(code)) return;
  me.badges.add(code);
  setTimeout(() => {
    toast(`${bdg(code)}<div><b>Nouveau badge : ${esc(BADGES[code][0])}</b><small>${esc(BADGES[code][1])}</small></div>${pin('rewards')}`, '', 5200);
    S.notifs.unshift({ id: Date.now() + 1, kind: 'badge', badge: code, text: `Nouveau badge : ${BADGES[code][0]}`, min: 0, read: false });
    render();
  }, 900);
}
function requireLogin(fn) { if (S.logged) return fn(); S.pending = fn; openLogin(); }

/* L'identifiant @ est tiré du pseudo, jamais du nom réel ni de l'adresse e-mail. Il ne change plus ensuite. */
function setHandle(u, pseudo) {
  const base = (pseudo.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'Membre').slice(0, 20);
  let h = base, i = 2;
  while (USERS[h] && USERS[h] !== u) h = base + '_' + i++;
  delete USERS[u.username]; u.username = h; USERS[h] = u;
}

/* Recadrage carré au centre, réduit à 256 px : la photo reste légère, quelle que soit l'image choisie. */
function squarePhoto(file) {
  return new Promise((ok, ko) => {
    const img = new Image(), src = URL.createObjectURL(file);
    img.onload = () => {
      const side = Math.min(img.width, img.height), c = document.createElement('canvas');
      c.width = c.height = 256;
      c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 256, 256);
      URL.revokeObjectURL(src); ok(c.toDataURL('image/jpeg', .86));
    };
    img.onerror = () => { URL.revokeObjectURL(src); ko(); };
    img.src = src;
  });
}

/* ====================== Mentions ====================== */
const norm = x => x.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const MENTION_RE = /@([A-Za-z0-9_\-]+(?:\.[A-Za-z0-9_\-]+)*)/g;
let M = null; // liste ouverte : { ta, start, q, items, i }

function mentionContext() {
  if (S.view === 'topic') { const t = TOPICS.find(x => x.id === S.arg); return [t.author, ...t.replies.map(r => r.author)]; }
  if (S.view === 'post') { const b = BLOGS.find(x => x.id === S.arg); return [b.author, ...b.comments.map(r => r.author)]; }
  return [];
}
/* Participants de la page d'abord, puis la rédaction, puis les autres membres ; à rang égal, ceux dont
   le prénom ou le pseudo commence par la saisie, puis les plus actifs. */
function mentionList(q) {
  const near = new Set(mentionContext()), nq = norm(q);
  return Object.values(USERS)
    .filter(u => u.role !== 'moderator' && u.username !== S.me.username && (!nq || norm(u.username).includes(nq) || norm(u.name).includes(nq)))
    .map(u => ({ u, near: near.has(u.username), rank: (near.has(u.username) ? 0 : u.role === 'redaction' ? 2 : 4) + (nq && !norm(u.name).startsWith(nq) && !norm(u.username).startsWith(nq) ? 1 : 0) }))
    .sort((a, b) => a.rank - b.rank || b.u.points - a.u.points)
    .slice(0, 6);
}
/* Position du curseur dans un textarea : on recopie le texte qui précède dans un calque invisible de même mise en forme. */
function caretRect(ta) {
  const cs = getComputedStyle(ta), m = document.createElement('div');
  ['boxSizing', 'width', 'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft', 'borderTopWidth', 'borderRightWidth', 'borderBottomWidth', 'borderLeftWidth',
    'fontFamily', 'fontSize', 'fontWeight', 'lineHeight', 'letterSpacing', 'wordSpacing', 'textIndent'].forEach(p => { m.style[p] = cs[p]; });
  Object.assign(m.style, { position: 'absolute', visibility: 'hidden', whiteSpace: 'pre-wrap', overflowWrap: 'break-word', top: '0', left: '-9999px' });
  m.textContent = ta.value.slice(0, ta.selectionStart);
  const mark = document.createElement('span'); mark.textContent = '​'; m.appendChild(mark);
  document.body.appendChild(m);
  const r = ta.getBoundingClientRect(), lh = parseFloat(cs.lineHeight) || parseFloat(cs.fontSize) * 1.4;
  const x = r.left + mark.offsetLeft - ta.scrollLeft, top = r.top + mark.offsetTop - ta.scrollTop;
  m.remove();
  return { x, top, bottom: top + lh };
}
function drawMention() {
  const { ta, q, items, i } = M, c = caretRect(ta);
  $('#mention').innerHTML = `<div class="mention-pop" role="listbox" aria-label="Mentionner un membre">
    <div class="mp-head">${q ? `Membres correspondant à « ${esc(q)} »` : 'Mentionner un membre'}</div>
    ${items.length ? items.map(({ u, near }, k) => `<button type="button" class="mp-item ${k === i ? 'on' : ''}" role="option" aria-selected="${k === i}" data-act="mention-pick" data-i="${k}">${av(u, 'sm', false)}<span><b>${esc(u.name)}</b><small>@${esc(u.username)}${u.role === 'redaction' ? ' · Rédaction' : near ? ' · dans cette page' : ''}</small></span></button>`).join('')
      : '<div class="mp-empty">Aucun membre ne correspond.</div>'}
  </div>`;
  const pop = $('#mention .mention-pop'), h = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(c.x - 14, innerWidth - pop.offsetWidth - 8)) + 'px';
  pop.style.top = (c.bottom + 6 + h > innerHeight - 8 ? Math.max(8, c.top - h - 6) : c.bottom + 6) + 'px';
}
function closeMention() { if (M) { M = null; $('#mention').innerHTML = ''; } }
function checkMention(ta) {
  const pos = ta.selectionStart, m = ta.value.slice(0, pos).match(/(^|[\s(])@([\p{L}\p{N}_.\-]{0,24})$/u);
  if (!m || !S.logged) return closeMention();
  M = { ta, start: pos - m[2].length - 1, q: m[2], items: mentionList(m[2]), i: 0 };
  drawMention();
}
function pickMention(k) {
  const { ta, start, items } = M, it = items[k]; if (!it) return;
  const ins = '@' + it.u.username + ' ';
  ta.setRangeText(ins, start, ta.selectionStart, 'end');
  ta.focus();
  closeMention();
  ta.dispatchEvent(new Event('input', { bubbles: true }));
}
function notifyMentions(body) {
  const names = [...new Set([...body.matchAll(MENTION_RE)].map(m => m[1]))].filter(n => USERS[n] && n !== S.me.username);
  if (!names.length) return;
  const list = names.map(n => USERS[n].name), who = list.length > 1 ? list.slice(0, -1).join(', ') + ' et ' + list[list.length - 1] : list[0];
  setTimeout(() => toast(`${icon('at')}<div><b>${esc(who)} ${names.length > 1 ? 'recevront' : 'recevra'} une notification</b><small>Grâce à votre mention dans ce message.</small></div>`), 1300);
}

/* ====================== Contrôle des liens pendant la saisie ====================== */
function updateLinkNote(ta) {
  let note = ta.parentElement.querySelector(':scope > .link-note');
  if (!note) { note = document.createElement('div'); note.className = 'link-note'; note.setAttribute('aria-live', 'polite'); ta.after(note); }
  const links = [...ta.value.matchAll(LINK_RE)].map(m => hostOf(cleanLink(m[0]))), bad = [...new Set(links.filter(h => !trusted(h)))];
  if (!links.length) { note.className = 'link-note'; note.innerHTML = ''; return true; }
  if (!bad.length) { note.className = 'link-note ln-ok'; note.innerHTML = `${icon('check')}<span>Lien vers une source de confiance : il sera cliquable.</span>`; return true; }
  if (canPostExternal()) { note.className = 'link-note ln-warn'; note.innerHTML = `${icon('shield')}<span>Le lien vers <b>${esc(bad.join(', '))}</b> sera vérifié par la modération avant d'être cliquable. ${pin('links')}</span>`; return true; }
  note.className = 'link-note ln-bad';
  note.innerHTML = `${icon('shield')}<span>Les liens vers <b>${esc(bad.join(', '))}</b> ne sont pas autorisés à votre niveau. Sont acceptés : lerevenu.com, les sites publics (.gouv.fr, service-public.fr), l'AMF, la Banque de France, l'Insee et la Cour des comptes. <a data-act="go" data-view="charter">Pourquoi ?</a> ${pin('links')}</span>`;
  return false;
}
const linkGuard = ta => { if (updateLinkNote(ta)) return true; ta.focus(); return false; };
