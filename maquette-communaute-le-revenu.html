function simulateReply(topicId) {
  const t = TOPICS.find(x => x.id === topicId);
  const texts = {
    question: ['Vincent_ETF', 'Bonne question ! J\'étais dans la même situation l\'an dernier. Le plus utile pour moi a été de faire une simulation avant de me décider, puis d\'en parler ici. Je peux détailler mon cas si ça vous aide.'],
    discussion: ['Odile.Retraite', 'Merci d\'avoir lancé ce sujet, c\'est exactement la question que je me posais. Je vous raconte mon expérience ce soir !'],
    poll: ['PapyBoursier', 'J\'ai voté ! Curieux de voir les résultats dans quelques jours.'],
  }[t.type];
  timers.push(setTimeout(() => {
    t.replies.push(R(texts[0], texts[1], 0, 0));
    const a = user(texts[0]);
    S.notifs.unshift({ id: Date.now(), kind: 'reply', actor: texts[0], topic: t.id, text: t.type === 'question' ? 'a répondu à votre question' : 'a réagi à votre publication', min: 0, read: false });
    toast(`${av(a, 'sm')}<div><b>${esc(a.name)}</b> vient de répondre<small>${esc(t.title.slice(0, 60))}…</small></div><button class="tbtn" data-act="open" data-id="${t.id}">Voir</button>`, '', 7000);
    render();
    timers.push(setTimeout(() => { if (t.type === 'question') t.likes += 2; }, 2000));
  }, 6000));
}

/* ====================== Événements ====================== */
const A = {
  home: () => go('home'),
  go: el => { closeModal(); go(el.dataset.view); },
  cat: el => go('cat', el.dataset.slug),
  open: el => {
    closeModal();
    go('topic', +el.dataset.id);
    if (el.dataset.focus) A['focus-reply']();
  },
  profile: el => { if (el.dataset.u) go('profile', el.dataset.u); },
  openpost: el => { closeModal(); go('post', +el.dataset.id); },
  'write-blog': () => { if (S.menu) { S.menu = null; render(); } openBlogEditor(); },
  photo: () => { if (S.menu) { S.menu = null; render(); } openPhoto(); },
  'photo-remove': () => setPhotoDraft(null),
  'like-post': el => requireLogin(() => {
    const b = BLOGS.find(x => x.id === +el.dataset.id), target = el.dataset.r ? b.comments.find(r => r.id === +el.dataset.r) : b;
    if (target.author === S.me.username) return toast(`${icon('thumb')}<div>Vous ne pouvez pas marquer votre propre message comme utile.</div>`);
    target.liked = !target.liked; target.likes += target.liked ? 1 : -1;
    render();
  }),
  'mention-start': el => requireLogin(() => {
    const ta = $('#' + el.dataset.for); if (!ta) return;
    ta.focus();
    const p = ta.selectionStart, before = ta.value.slice(0, p);
    ta.setRangeText((before && !/\s$/.test(before) ? ' ' : '') + '@', p, ta.selectionEnd, 'end');
    ta.dispatchEvent(new Event('input', { bubbles: true }));
  }),
  staff: () => { S.staff = !S.staff; render(); toast(`${icon(S.staff ? 'globe' : 'user')}<div><b>${S.staff ? 'Vue rédaction activée' : 'Vue membre'}</b><small>${S.staff ? 'Les indicateurs de référencement et la validation des réponses sont visibles.' : 'Les indicateurs réservés à l\'équipe sont masqués.'}</small></div>`); },
  verify: el => { const t = TOPICS.find(x => x.id === +el.dataset.id), r = t.replies.find(x => x.id === +el.dataset.r); r.verified = !r.verified; render(); if (r.verified) toast(`${icon('verified')}<div><b>Réponse validée par la rédaction</b><small>La mention s'affiche sous la réponse et renforce son référencement.</small></div>`); },
  'mention-pick': el => { if (M) pickMention(+el.dataset.i); },
  tab: el => { S.tab = el.dataset.tab; render(); },
  mode: el => { const m = el.dataset.mode; closeModal(); init(m); render(true); toast(m === 'member' ? `${icon('user')}<div><b>Point de vue : Camille, membre active</b><small>142 points, 6 jours d'affilée, 3 notifications</small></div>` : `${icon('eye')}<div><b>Point de vue : visiteur non connecté</b><small>Essayez « Utile » ou « Publier » pour voir l'inscription</small></div>`); },
  notes: () => { S.notes = !S.notes; if (!S.notes) { $('#note').innerHTML = ''; } render(); if (S.notes) showNote(S.logged ? 'tabs' : 'visitor'); },
  note: el => showNote(el.dataset.note),
  'note-close': () => { $('#note').innerHTML = ''; },
  'note-step': el => { const i = (NOTE_KEYS.indexOf(S.note) + +el.dataset.d + NOTE_KEYS.length) % NOTE_KEYS.length; showNote(NOTE_KEYS[i]); },
  reset: () => { closeModal(); $('#note').innerHTML = ''; init(S.logged ? 'member' : 'visitor'); render(true); },
  login: () => { S.menu = null; openLogin(); },
  compose: el => openComposer({ type: el.dataset.type, cat: el.dataset.cat, title: el.dataset.title }),
  menu: el => { requireLogin(() => { S.menu = S.menu === el.dataset.menu ? null : el.dataset.menu; render(); if (S.menu && window.innerWidth <= 760) window.scrollTo({ top: 0 }); }); },
  readall: () => { S.notifs.forEach(n => n.read = true); render(); },
  notif: el => { const n = S.notifs.find(x => x.id === +el.dataset.id); n.read = true; S.menu = null; if (n.topic) go('topic', n.topic); else if (n.kind === 'badge' || n.kind === 'level') go('profile', S.me.username); else render(); },
  like: el => requireLogin(() => {
    const t = TOPICS.find(x => x.id === +el.dataset.id);
    const target = el.dataset.r ? t.replies.find(r => r.id === +el.dataset.r) : t;
    if (target.author === S.me.username) return toast(`${icon('thumb')}<div>Vous ne pouvez pas marquer votre propre message comme utile.</div>`);
    target.liked = !target.liked; target.likes += target.liked ? 1 : -1;
    if (target.liked && S.firstLike) { S.firstLike = false; toast(`${icon('thumb')}<div><b>Merci !</b><small>${esc(user(target.author).name)} reçoit +5 points grâce à vous.</small></div>`); }
    render();
  }),
  vote: el => requireLogin(() => {
    const t = TOPICS.find(x => x.id === +el.dataset.id), i = +el.dataset.i;
    if (t.myVote === i) return;
    const first = t.myVote == null;
    if (!first) t.options[t.myVote].votes--;
    t.options[i].votes++; t.myVote = i;
    render();
    if (first) { award(1, 'Merci pour votre vote'); S.me.stats.votes++; if (S.me.stats.votes >= 3) badge('citoyen'); }
  }),
  follow: el => requireLogin(() => { const t = TOPICS.find(x => x.id === +el.dataset.id); t.followed = !t.followed; render(); toast(`${icon('bell')}<div>${t.followed ? '<b>Discussion suivie</b><small>Vous serez notifié des nouvelles réponses.</small>' : 'Vous ne suivez plus cette discussion.'}</div>`); }),
  rsvp: el => requireLogin(() => { const e = EVENTS.find(x => x.id === +el.dataset.id); e.me = !e.me; e.going += e.me ? 1 : -1; render(); if (e.me) toast(`${icon('cal')}<div><b>C'est noté !</b><small>Rappel la veille par notification et e-mail. Vous pouvez déjà poser vos questions.</small></div>`); }),
  share: () => { try { navigator.clipboard.writeText('https://communaute.lerevenu.com/t/' + S.arg).catch(() => {}); } catch (e) {} toast(`${icon('link')}<div>Lien copié</div>`); },
  report: () => openReport(),
  replyto: el => requireLogin(() => { const ta = $('#reply-body'); if (!ta) return; ta.value = (ta.value ? ta.value + ' ' : '') + '@' + el.dataset.u + ' '; S.drafts[dkey()] = ta.value; ta.focus(); ta.scrollIntoView({ behavior: 'smooth', block: 'center' }); }),
  'focus-reply': () => requireLogin(() => setTimeout(() => { const ta = $('#reply-body'); if (ta) { ta.scrollIntoView({ behavior: 'smooth', block: 'center' }); ta.focus({ preventScroll: true }); } }, 50)),
  jump: el => { const p = $('#r' + el.dataset.id); if (p) { p.scrollIntoView({ behavior: 'smooth', block: 'center' }); p.classList.remove('flash'); void p.offsetWidth; p.classList.add('flash'); } },
  solve: el => {
    const t = TOPICS.find(x => x.id === +el.dataset.id), rid = +el.dataset.r;
    const r = t.replies.find(x => x.id === rid);
    t.solution = t.solution === rid ? null : rid;
    render();
    if (t.solution) toast(`${icon('check')}<div><b>Meilleure réponse choisie</b><small>${esc(user(r.author).name)} reçoit +20 points. Merci d'avoir clôturé votre question !</small></div>`);
  },
  'edit-profile': () => { S.menu = null; render(); openOnboarding(true); },
  addopt: () => { const box = $('#c-opts'); const n = box.children.length; if (n >= 6) return; box.insertAdjacentHTML('beforeend', optRow('', n)); box.lastElementChild.querySelector('input').focus(); saveComposerDraft(); },
  delopt: el => { el.closest('.opt-row').remove(); saveComposerDraft(); },
  density: el => { S.density = el.dataset.d; try { localStorage.setItem('lr-density', S.density); } catch (e) {} render(); },
  'search-chip': el => { S.search = el.dataset.q; render(); },
  close: () => closeModal(),
  overlay: (el, e) => { if (e.target === el) closeModal(); },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (S.menu && !e.target.closest('.dropdown') && !(el && el.dataset.act === 'menu')) { S.menu = null; if (!el) { render(); return; } }
  if (!el) return;
  const fn = A[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  e.stopPropagation();
  fn(el, e);
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'f-search' || f.id === 'f-search2') { S.search = f.elements.q.value; go('search'); return; }
  if (f.id === 'f-login') {
    const name = 'Alex';
    USERS.Alex_M = U('Alex_M', name, 'var(--av-3)', 0, 0, { since: new Date().toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }), streak: 1, interests: [], badges: new Set(), stats: { topics: 0, replies: 0, likes: 0, solutions: 0, votes: 0 } });
    loginAs('Alex_M', false);
    S.notifs = [];
    openOnboarding(false);
    return;
  }
  if (f.id === 'f-onboard') {
    const me = S.me, edit = f.dataset.edit === '1';
    me.interests = [...f.querySelectorAll('[name=i]:checked')].map(i => i.value);
    me.bio = f.elements.bio.value.trim();
    const ps = f.elements.pseudo, pseudo = ps.value.trim().replace(/\s+/g, ' ').slice(0, 24);
    f.querySelectorAll('.err-msg').forEach(x => x.remove()); ps.classList.remove('err');
    if (pseudo.length < 3) { ps.classList.add('err'); ps.insertAdjacentHTML('afterend', '<span class="err-msg">Choisissez un pseudo d\'au moins 3 caractères.</span>'); ps.focus(); return; }
    me.name = pseudo;
    if (!edit) setHandle(me, pseudo);
    closeModal();
    if (edit) { render(); toast(`${icon('check')}<div>Profil enregistré</div>`); return; }
    S.tab = null; render();
    award(5, 'Bienvenue dans la communauté !'); badge('bienvenue');
    const p = S.pending; S.pending = null;
    if (p) setTimeout(p, 400);
    return;
  }
  if (f.id === 'f-compose') {
    const E = f.elements, type = E.type.value, title = E.title.value.trim().replace(/\s+/g, ' '), slug = E.cat.value;
    const opts = [...f.querySelectorAll('[name=opt]')].map(i => i.value.trim()).filter(Boolean);
    f.querySelectorAll('.err-msg').forEach(x => x.remove());
    f.querySelectorAll('.err').forEach(x => x.classList.remove('err'));
    const err = (input, msg) => { input.classList.add('err'); input.insertAdjacentHTML('afterend', `<span class="err-msg">${msg}</span>`); };
    let ok = true;
    if (title.length < 10) { err(E.title, 'Ajoutez quelques mots : un titre précis obtient plus de réponses (10 caractères minimum).'); ok = false; }
    if (!slug) { err(E.cat, 'Choisissez l\'espace où publier.'); ok = false; }
    if (type === 'poll' && opts.length < 2) { err($('#c-opts'), 'Un sondage a besoin d\'au moins deux réponses.'); ok = false; }
    if (!updateLinkNote(E.body)) ok = false;
    if (!ok) return;
    const id = Math.max(...TOPICS.map(t => t.id)) + 1;
    TOPICS.unshift({ id, cat: slug, type, author: S.me.username, min: 0, likes: 0, views: 1, title, body: E.body.value.trim(), replies: [], liked: false, followed: true, myVote: null, solution: null,
      options: type === 'poll' ? opts.map(label => ({ label, votes: 0 })) : undefined });
    S.drafts.composer = null;
    closeModal();
    go('topic', id);
    S.me.stats.topics++;
    award(5, type === 'question' ? 'Question publiée' : type === 'poll' ? 'Sondage publié' : 'Discussion publiée');
    badge('premier_sujet'); if (type === 'poll') badge('sondeur');
    toast(`${icon('bell')}<div><b>Vous suivez cette discussion</b><small>Vous serez notifié dès qu'un membre répond.</small></div>`, '', 5000);
    simulateReply(id);
    return;
  }
  if (f.id === 'f-reply') {
    const body = f.elements.body.value.trim(), t = TOPICS.find(x => x.id === +f.dataset.id);
    if (body.length < 2) { f.elements.body.focus(); return; }
    if (!linkGuard(f.elements.body)) return;
    const r = R(S.me.username, body, 0, 0);
    t.replies.push(r); t.followed = true; S.drafts[dkey()] = '';
    render();
    const el = $('#r' + r.id); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('flash'); }
    S.me.stats.replies++;
    award(3, 'Merci pour votre réponse');
    badge('premiere_reponse');
    notifyMentions(body);
    return;
  }
  if (f.id === 'f-comment') {
    const body = f.elements.body.value.trim(), b = BLOGS.find(x => x.id === +f.dataset.id);
    if (body.length < 2) { f.elements.body.focus(); return; }
    if (!linkGuard(f.elements.body)) return;
    const r = R(S.me.username, body, 0, 0);
    b.comments.push(r); S.drafts[dkey()] = '';
    render();
    const el = $('#r' + r.id); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('flash'); }
    award(3, 'Merci pour votre commentaire');
    notifyMentions(body);
    return;
  }
  if (f.id === 'f-blog') {
    const E = f.elements, title = E.title.value.trim().replace(/\s+/g, ' '), body = E.body.value.trim();
    f.querySelectorAll('.err-msg').forEach(x => x.remove());
    f.querySelectorAll('.err').forEach(x => x.classList.remove('err'));
    const err = (input, msg) => { input.classList.add('err'); input.insertAdjacentHTML('afterend', `<span class="err-msg">${msg}</span>`); };
    let ok = true;
    if (title.length < 10) { err(E.title, 'Donnez un titre à votre billet (10 caractères minimum).'); ok = false; }
    if (body.length < 60) { err(E.body, 'Développez un peu votre récit : quelques phrases suffisent (60 caractères minimum).'); ok = false; }
    if (!updateLinkNote(E.body)) ok = false;
    if (!ok) return;
    const id = Math.max(...BLOGS.map(b => b.id)) + 1;
    BLOGS.unshift({ id, author: S.me.username, cat: E.cat.value || null, min: 0, likes: 0, liked: false, views: 1, title, body, comments: [] });
    S.drafts.blog = null;
    closeModal();
    go('post', id);
    award(5, 'Billet publié');
    notifyMentions(body);
    return;
  }
  if (f.id === 'f-photo') {
    const had = !!S.me.photo;
    S.me.photo = S.photoDraft; S.photoDraft = null;
    closeModal(); render();
    toast(`${icon('camera')}<div>${S.me.photo ? 'Photo de profil mise à jour' : had ? 'Photo retirée' : 'Aucune modification'}</div>`);
    return;
  }
  if (f.id === 'f-report') { closeModal(); toast(`${icon('shield')}<div><b>Signalement envoyé</b><small>Merci, l'équipe de modération va examiner ce message.</small></div>`); }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'reply-body') S.drafts[dkey()] = t.value;
  if (t.matches('textarea[data-mention]')) { checkMention(t); updateLinkNote(t); }
  if (t.closest('#f-blog')) saveBlogDraft();
  if (t.id === 'q') S.search = t.value;
  if (t.closest('#f-compose')) { if (t.id === 'c-title') updateSimilar(); saveComposerDraft(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'ph-file' && t.files[0]) {
    squarePhoto(t.files[0]).then(setPhotoDraft, () => toast(`${icon('camera')}<div>Cette image n'a pas pu être lue. Essayez un fichier JPG ou PNG.</div>`));
    t.value = '';
  }
  if (t.name === 'type' && t.closest('#f-compose')) {
    $('#c-poll').hidden = t.value !== 'poll';
    $('#c-title').placeholder = placeholderFor(t.value);
    saveComposerDraft();
  }
});
document.addEventListener('keydown', e => {
  if (M && e.target === M.ta) {
    if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && M.items.length) {
      e.preventDefault(); M.i = (M.i + (e.key === 'ArrowDown' ? 1 : -1) + M.items.length) % M.items.length; drawMention(); return;
    }
    if (((e.key === 'Enter' && !e.ctrlKey && !e.metaKey) || e.key === 'Tab') && M.items.length) { e.preventDefault(); pickMention(M.i); return; }
    if (e.key === 'Escape') { e.preventDefault(); closeMention(); return; }
  }
  if (e.key === 'Escape') { if ($('#modal').innerHTML) closeModal(); else if (S.menu) { S.menu = null; render(); } else $('#note').innerHTML = ''; }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.tagName === 'TEXTAREA') { const f = e.target.closest('form'); if (f) f.requestSubmit(); }
});

/* La liste de mentions garde le focus dans le texte ; elle se ferme quand on quitte le champ ou fait défiler la page. */
document.addEventListener('mousedown', e => { if (e.target.closest('.mention-pop')) e.preventDefault(); });
document.addEventListener('focusout', e => { if (M && e.target === M.ta) setTimeout(() => { if (M && document.activeElement !== M.ta) closeMention(); }, 120); });
document.addEventListener('scroll', e => { if (M && e.target !== M.ta) closeMention(); hideCard(); }, true);
/* Fiche au survol : seulement avec une souris, après un court délai, et elle reste ouverte quand on la survole. */
if (matchMedia('(hover: hover)').matches) {
  document.addEventListener('mouseover', e => {
    if (e.target.closest('.hovercard')) { clearTimeout(HC.hide); return; }
    const a = e.target.closest(HC_SEL); if (!a) return;
    clearTimeout(HC.hide);
    if (a === HC.anchor) return;
    clearTimeout(HC.show);
    HC.show = setTimeout(() => showCard(a), 400);
  });
  document.addEventListener('mouseout', e => {
    const from = e.target.closest(HC_SEL + ', .hovercard');
    if (!from || (e.relatedTarget && from.contains(e.relatedTarget))) return;
    clearTimeout(HC.show);
    HC.hide = setTimeout(hideCard, 250);
  });
}
document.addEventListener('keyup', e => { if (M && e.target === M.ta && (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'Home' || e.key === 'End')) checkMention(e.target); });

init('visitor');
render();
</script>
